{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <h1>
        Are you sure you would like to delete {{ product.name }}?
    </h1>

    <form method="POST">
        {% csrf_token %}

        <button
            type="submit"
            class="btn btn-danger"
        >
            Delete Product
        </button>
    </form>

</div>

{% endblock %}
