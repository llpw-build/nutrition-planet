{% extends "base.html" %}

{% block content %}

<h1>Delete Review</h1>

<p>
  Are you sure you want to delete your review for
  <strong>{{ review.product.name }}</strong>?
</p>

<form method="POST">
  {% csrf_token %}

  <button type="submit" class="btn btn-danger">
    Delete Review
  </button>
</form>

<a href="{% url 'product_detail' review.product.id %}">
  Cancel
</a>

{% endblock %}
