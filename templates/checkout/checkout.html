{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <h1>Checkout</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn btn-primary"
        >
            Place Order
        </button>
    </form>

</div>

{% endblock %}
