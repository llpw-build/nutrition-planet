{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-9 col-lg-7">

            <h1 class="mb-4">
                Checkout
            </h1>

            <form method="POST" id="payment-form">

                {% csrf_token %}

                <input
                    type="hidden"
                    name="payment_intent_id"
                    value="{{ payment_intent_id }}"
                >

                <div class="mb-3">

                    <label
                        for="{{ form.full_name.id_for_label }}"
                        class="form-label"
                    >
                        Full name
                    </label>

                    {{ form.full_name }}

                </div>


                <div class="mb-3">

                    <label
                        for="{{ form.email.id_for_label }}"
                        class="form-label"
                    >
                        Email
                    </label>

                    {{ form.email }}

                </div>


                <div class="mb-3">

                    <label
                        for="{{ form.phone_number.id_for_label }}"
                        class="form-label"
                    >
                        Phone number
                    </label>

                    {{ form.phone_number }}

                </div>


                <div class="mb-3">

                    <label
                        for="{{ form.street_address.id_for_label }}"
                        class="form-label"
                    >
                        Street address
                    </label>

                    {{ form.street_address }}

                </div>


                <div class="mb-3">

                    <label
                        for="{{ form.town_or_city.id_for_label }}"
                        class="form-label"
                    >
                        Town or city
                    </label>

                    {{ form.town_or_city }}

                </div>


                <div class="mb-3">

                    <label
                        for="{{ form.postcode.id_for_label }}"
                        class="form-label"
                    >
                        Postcode
                    </label>

                    {{ form.postcode }}

                </div>


                <div class="mb-4">

                    <label
                        for="{{ form.country.id_for_label }}"
                        class="form-label"
                    >
                        Country
                    </label>

                    {{ form.country }}

                </div>


                <div
                    id="payment-element"
                    class="mb-3"
                >
                </div>


                <p
                    id="payment-errors"
                    class="text-danger"
                >
                </p>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Place Order
                </button>

            </form>

        </div>

    </div>

</div>


<script src="https://js.stripe.com/v3/"></script>

<script>

    const stripe = Stripe("{{ stripe_public_key }}");

    const elements = stripe.elements({
        clientSecret: "{{ client_secret }}"
    });

    const paymentElement = elements.create("payment");

    paymentElement.mount("#payment-element");

    const form = document.getElementById("payment-form");

    const errorContainer = document.getElementById("payment-errors");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const formData = new FormData(form);

        const response = await fetch("/checkout/", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        const result = await stripe.confirmPayment({
            elements: elements,
            confirmParams: {
                return_url:
                    `${window.location.origin}/checkout/success/${data.order_id}/`
            }
        });

        if (result.error) {
            errorContainer.textContent = result.error.message;
        }

    });

</script>

{% endblock %}
